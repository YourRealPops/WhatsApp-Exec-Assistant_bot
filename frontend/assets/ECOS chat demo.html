<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECOS chat demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f4f5f2;--ink:#14181a;--muted:#5d676b;--phone:#101416;--chat:#0b141a;
  --in:#202c33;--out:#005c4b;--text:#e9edef;--sub:#8696a0;--accent:#25d366;--card:#1a262d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050607;--ink:#f1f3f2;--muted:#8a9498;--phone:#1b2226}}
:root[data-theme="dark"]{--bg:#050607;--ink:#f1f3f2;--muted:#8a9498;--phone:#1b2226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center}
.wrap{max-width:1040px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:1fr 360px;gap:56px;align-items:center;width:100%}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.08;margin:0 0 18px;font-weight:700;letter-spacing:-.02em}
p.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 24px;max-width:46ch}
ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;color:var(--muted);font-size:16px}
li::before{content:"✓ ";color:#1fa855;font-weight:700}
.phone{background:var(--phone);border-radius:42px;padding:10px;width:100%;max-width:360px;margin:0 auto;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.screen{background:var(--chat);border-radius:33px;height:640px;display:flex;flex-direction:column;overflow:hidden;color:var(--text)}
.top{background:#1f2c34;padding:14px 16px;display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:#0b141a;border:1.5px solid var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--accent)}
.top b{display:block;font-size:15px}.top span{font-size:12px;color:var(--sub)}
.feed{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;justify-content:flex-end;
  background:radial-gradient(circle at 20% 10%,#0f1c24,transparent 60%),var(--chat)}
.m{max-width:84%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.m.show{opacity:1;transform:none}
.m.out{align-self:flex-end;background:var(--out);border-top-right-radius:3px}
.m.in{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
.m small{display:block;text-align:right;font-size:10px;color:var(--sub);margin-top:3px}
.m .k{color:var(--sub);font-size:12px}
.btns{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:#0b141a;color:#53bdeb;font-weight:500;font-size:13px;border:1px solid #2a3942;transition:background .2s,color .2s}
.btn.tap{background:var(--accent);color:#06210f;border-color:var(--accent)}
.ok{color:var(--accent);font-weight:700}
.brief{background:var(--card);border-left:3px solid var(--accent)}
.brief div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.dots{display:inline-flex;gap:4px;padding:4px 2px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.bar{background:#1f2c34;padding:12px 16px;font-size:13px;color:var(--sub)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:32px}.screen{height:600px}}
@media (prefers-reduced-motion:reduce){.m{transition:none}.dots i{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <section>
    <h1>Your chief of staff, in a WhatsApp chat.</h1>
    <p class="lead">Say what needs to happen. ECOS prepares it, asks for your approval, then confirms it was done.</p>
    <ul>
      <li>Schedules and moves meetings on your calendar</li>
      <li>Asks before it acts, every time</li>
      <li>Sends your morning briefing</li>
    </ul>
  </section>
  <div class="phone" aria-label="Animated example of an ECOS conversation on WhatsApp">
    <div class="screen">
      <div class="top"><div class="av">EC</div><div><b>ECOS</b><span id="status">online</span></div></div>
      <div class="feed" id="feed"></div>
      <div class="bar">Message</div>
    </div>
  </div>
</main>
<script>
(function(){
  var feed=document.getElementById('feed'),status=document.getElementById('status');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wait=function(ms){return new Promise(function(r){setTimeout(r,reduce?0:ms)})};
  function add(cls,html){
    var d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;feed.appendChild(d);
    requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('show')})});
    return d;
  }
  async function typing(ms){
    status.textContent='typing…';
    var d=add('in','<span class="dots"><i></i><i></i><i></i></span>');
    await wait(ms);d.remove();status.textContent='online';
  }
  async function run(){
    while(true){
      feed.innerHTML='';
      await wait(900);
      add('out','Book 30 mins with Tobi next Tuesday after 11.<small>9:41 ✓✓</small>');
      await wait(1000);await typing(1400);
      var p=add('in','I found a slot:<br><b>Tue 10 Nov, 11:30–12:00 (WAT)</b><br><span class="k">Tobi’s calendar isn’t connected, so his availability is unchecked.</span><div class="btns"><div class="btn" id="ap">Approve</div><div class="btn">Change</div></div><small>9:41</small>');
      await wait(2400);
      var ap=p.querySelector('#ap');ap.classList.add('tap');await wait(500);
      add('out','Approve<small>9:42 ✓✓</small>');
      await wait(900);await typing(1100);
      add('in','<span class="ok">✓ Done.</span> Added to your Google Calendar and invite sent to Tobi.<small>9:42</small>');
      await wait(2200);
      add('in','<b>Tomorrow’s briefing · 7:30 am</b><div class="brief" style="margin-top:6px;padding:8px 10px;border-radius:8px"><div><span>Meetings</span><b>3</b></div><div><span>Clashes</span><b>1</b></div><div><span>Tasks due</span><b>2</b></div><div><span>Waiting for you</span><b>1 approval</b></div></div><small>9:43</small>');
      await wait(4500);
      if(reduce)return;
      feed.style.transition='opacity .5s';feed.style.opacity=0;await wait(600);feed.style.opacity=1;
    }
  }
  run();
})();
</script>
</body>
</html>
